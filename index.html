<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <canvas id="bg" aria-hidden="true"></canvas>

  <main class="page">

    <!-- Painel esquerdo — branding -->
    <div class="brand-panel" aria-hidden="true">
      <div class="brand-inner">
        <div class="brand-logo">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <rect x="2"  y="2"  width="14" height="14" rx="3" fill="currentColor" opacity="0.9"/>
            <rect x="20" y="2"  width="14" height="14" rx="3" fill="currentColor" opacity="0.45"/>
            <rect x="2"  y="20" width="14" height="14" rx="3" fill="currentColor" opacity="0.45"/>
            <rect x="20" y="20" width="14" height="14" rx="3" fill="currentColor" opacity="0.9"/>
          </svg>
        </div>
        <div class="brand-logo">
          <img src="img/logotipo-amt-cloud-branco.png" alt="AMT Cloud" style="width: 200px; height: auto;" />
        </div>
        <p class="brand-tagline">Acesse seu painel com segurança.</p>
        <ul class="brand-features">
          <li>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            Autenticação segura
          </li>
          <li>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            Sessão protegida
          </li>
          <li>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
            Dados criptografados
          </li>
        </ul>
      </div>
      <p class="brand-footer">© 2025 Marcell. Todos os direitos reservados.</p>
    </div>

    <!-- Painel direito — formulário -->
    <div class="form-panel">
      <div class="card">

        <div class="card-head">
          <p class="card-welcome">Bem-vindo de volta</p>
          <h2 class="card-title">Entrar na conta</h2>
        </div>

        <!-- Alerta de erro global -->
        <div class="alert alert-error" id="globalError" role="alert" hidden>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="globalErrorMsg">Usuário ou senha incorretos.</span>
        </div>

        <form id="loginForm" method="POST" action="auth.php" novalidate>

          <!-- E-mail -->
          <div class="field" id="field-email">
            <label for="email">E-mail</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
              <input type="email" id="email" name="email"
                placeholder="seu@email.com"
                autocomplete="email" spellcheck="false" required/>
            </div>
            <span class="field-error" id="err-email">Insira um e-mail válido.</span>
          </div>

          <!-- Senha -->
          <div class="field" id="field-password">
            <label for="password">Senha</label>
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input type="password" id="password" name="password"
                placeholder="••••••••"
                autocomplete="current-password" required/>
              
            </div>
            <span class="field-error" id="err-password">A senha deve ter pelo menos 6 caracteres.</span>
          </div>

  

          <!-- Submit -->
          <button type="submit" class="btn-submit" id="btnSubmit">
            <span class="btn-label">Entrar</span>
            <span class="btn-loader" aria-hidden="true"></span>
          </button>

        </form>

      

      </div>
    </div>

  </main>

  <script src="login.js"></script>
</body>
</html>
