<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - AMT Cloud</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="login.css">
</head>
<body>

  <canvas id="bg"></canvas>

  <div class="login-container">

    <div class="login-box">

      <img src="img/amt-cloud.png" class="logo">

      <h1>Painel do Cliente</h1>

      <p>
        Faça login para acessar seus chamados e recursos contratados.
      </p>

      <form>

        <div class="input-group">
          <label>E-mail</label>
          <input type="email" placeholder="Digite seu e-mail">
        </div>

        <div class="input-group">
          <label>Senha</label>
          <input type="password" placeholder="Digite sua senha">
        </div>

        <div class="input-group">
        <label>Token AMT</label>
        <input type="text" placeholder="Digite o token fornecido pela AMT">
    </div>

        <button type="submit">
          Entrar
        </button>

      </form>

    </div>

  </div>

  <script src="login.js"></script>
</body>
</html>
